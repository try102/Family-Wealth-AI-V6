<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V6.5

</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>

🏠 Family Wealth AI OS

</h1>

<h2>

V6.5 Financial Health Build

</h2>

<!-- ====================== -->

<!-- 财富驾驶舱 -->

<!-- ====================== -->

<section>

<div class="card">

<h2>

📊 财富驾驶舱

</h2>

<h3>

净资产

</h3>

<p id="netWorth">

¥0

</p>

<h3>

总资产

</h3>

<p id="totalAssets">

¥0

</p>

<h3>

总负债

</h3>

<p id="totalLiability">

¥0

</p>

<h3>

年度收入

</h3>

<p id="totalIncome">

¥0

</p>

<h3>

投资收益

</h3>

<p id="investmentReturn">

¥0

</p>

<h3>

财富评分

</h3>

<p id="wealthScore">

0

</p>

<!-- V6.4 -->

<h3>

📊 资产配置分析

</h3>

<div id="allocationAnalysis">

暂无资产配置数据

</div>

<!-- V6.5新增 -->

<h3>

❤️ 财务健康分析

</h3>

<div id="financialHealth">

暂无数据

</div>

</div>

</section>

<!-- ====================== -->

<!-- 资产中心 -->

<!-- ====================== -->

<section>

<h2>

🏦 资产中心

</h2>

<div class="form">

<input

id="assetName"

placeholder="资产名称">

<select id="assetCategory">

<option value="现金">

现金

</option>

<option value="房产">

房产

</option>

<option value="企业资产">

企业资产

</option>

<option value="保险">

保险

</option>

<option value="贵金属">

贵金属

</option>

<option value="收藏品">

收藏品

</option>

<option value="其他">

其他

</option>

</select>

<input

id="assetType"

placeholder="资产类型">

<input

id="assetOwner"

placeholder="所属人">

<input

id="assetCountry"

placeholder="国家">

<input

id="assetCurrency"

placeholder="币种"

value="CNY">

<input

id="assetInstitution"

placeholder="金融机构/机构">

<input

id="assetAccount"

placeholder="账户信息">

<input

id="assetValue"

type="number"

placeholder="资产价值">

<button onclick="addNewAsset()">

添加资产

</button>

</div>

<div id="assetList">

</div>

</section>

<!-- ====================== -->

<!-- 负债中心 -->

<!-- ====================== -->

<section>

<h2>

💳 负债中心

</h2>

<div class="form">

<input

id="liabilityName"

placeholder="负债名称">

<input

id="liabilityCategory"

placeholder="负债类别">

<input

id="liabilityPrincipal"

type="number"

placeholder="负债本金">

<input

id="liabilityInterest"

type="number"

placeholder="利率 %">

<input

id="liabilityPeriod"

placeholder="周期">

<button onclick="addNewLiability()">

添加负债

</button>

</div>

<div id="liabilityList">

</div>

</section>
<!-- ====================== -->

<!-- 收入中心 -->

<!-- ====================== -->

<section>

<h2>

💰 收入中心

</h2>

<div class="form">

<input

id="incomeName"

placeholder="收入名称">

<input

id="incomeCategory"

placeholder="收入类别">

<input

id="incomeSource"

placeholder="收入来源">

<input

id="incomeAmount"

type="number"

placeholder="收入金额">

<button onclick="addIncome()">

添加收入

</button>

</div>

<div id="incomeList">

</div>

</section>

<!-- ====================== -->

<!-- 投资中心 -->

<!-- ====================== -->

<section>

<h2>

📈 投资中心

</h2>

<div class="form">

<input

id="investmentName"

placeholder="投资名称">

<input

id="investmentTicker"

placeholder="代码">

<input

id="investmentType"

placeholder="投资类型">

<label>

买入日期

</label>

<input

id="investmentBuyDate"

type="date">

<input

id="investmentBuyPrice"

type="number"

placeholder="买入价格">

<input

id="investmentBuyQuantity"

type="number"

placeholder="买入数量">

<label>

卖出日期

</label>

<input

id="investmentSellDate"

type="date">

<input

id="investmentSellPrice"

type="number"

placeholder="卖出价格">

<input

id="investmentSellQuantity"

type="number"

placeholder="卖出数量">

<input

id="investmentCurrentPrice"

type="number"

placeholder="当前价格">

<button onclick="addInvestment()">

添加投资

</button>

</div>

<div id="investmentList">

</div>

</section>

<!-- ====================== -->

<!-- AI CFO -->

<!-- ====================== -->

<section>

<h2>

🤖 AI CFO

</h2>

<button onclick="generateCFOReport()">

生成财富报告

</button>

<div id="cfoReport">

AI CFO 财富分析报告

</div>

</section>

<!-- ====================== -->

<!-- 税务中心 -->

<!-- ====================== -->

<section>

<h2>

🧾 税务中心

</h2>

<button onclick="generateTaxReport()">

生成税务报告

</button>

<div id="taxCenter">

等待接入

</div>

</section>

<!-- ====================== -->

<!-- 退休中心 -->

<!-- ====================== -->

<section>

<h2>

🏖 退休中心

</h2>

<button onclick="generateRetirementReport()">

生成退休规划

</button>

<div id="retirementCenter">

等待接入

</div>

</section>

<!-- ====================== -->

<!-- 系统入口 -->

<!-- ====================== -->

<script type="module" src="app.js"></script>

</body>

</html>
